name: CI

permissions:
  statuses: write
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
# ... rest of your workflow

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Install, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17

      - name: CI preflight (required Supabase environment variables)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          MISSING=""
          # Treat whitespace-only secrets as missing.
          is_blank() { [ -z "$(printf '%s' "$1" | tr -d '[:space:]')" ]; }

          if is_blank "$VITE_SUPABASE_URL"; then
            MISSING="$MISSING VITE_SUPABASE_URL"
          fi
          if is_blank "$VITE_SUPABASE_PUBLISHABLE_KEY" && is_blank "$VITE_SUPABASE_ANON_KEY"; then
            MISSING="$MISSING VITE_SUPABASE_PUBLISHABLE_KEY(or VITE_SUPABASE_ANON_KEY)"
          fi
          if is_blank "$VITE_SUPABASE_PROJECT_ID"; then
            echo "::warning::VITE_SUPABASE_PROJECT_ID is not set (optional, used by tooling)."
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::CI preflight failed. Missing or empty repository secrets:" >&2
            for name in $MISSING; do
              echo "   - $name" >&2
            done
            echo "   Add them at Settings -> Secrets and variables -> Actions -> New repository secret." >&2
            echo "   Note: a secret that exists but is empty still counts as missing." >&2
            exit 1
          fi
          echo "CI preflight passed: Supabase environment variables are configured."

      - name: Migration preflight (advisory lock signatures)
        run: bun run scripts/preflight-advisory-locks.mjs

      - name: Migration preflight (idempotency + no live-data mutations)
        run: bun run scripts/verify-migration-idempotency.mjs

      - name: Migration preflight (extracted admin backfill jobs are current)
        run: bun run scripts/extract-migration-dml.mjs --check

      - name: Migration preflight (realtime publication membership)
        run: bun run scripts/verify-realtime-publication.mjs
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}

      - name: Install dependencies (lockfile must be in sync)
        run: bun install --frozen-lockfile

      - name: Verify testing-library DOM peer is resolvable
        run: |
          bun -e "require('@testing-library/dom')" || {
            echo "Stale bun cache detected; clearing and reinstalling..."
            rm -rf node_modules bun.lockb
            bun install --frozen-lockfile
            bun -e "require('@testing-library/dom')"
          }

      - name: Production build
        run: bun run build
        env:
          VITE_APP_VERSION: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          # Sentry source-map upload (gated on token presence; builds without it
          # still generate maps locally but do not upload).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: creative-breakroom-llc-s2
          SENTRY_PROJECT: jet-around

      - name: Verify crash reporting is configured for release builds
        run: bun run scripts/verify-observability.mjs
        env:
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          # Advisory on PRs, blocking on main so a release never ships blind.
          OBSERVABILITY_STRICT: ${{ github.ref == 'refs/heads/main' }}

      - name: Unit tests
        run: bun run test
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Notify Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: 'Vercel - the-jet-main: Prod_Deploy_Check'



  e2e:
    name: Playwright smoke suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.17

      - name: CI preflight (required Supabase environment variables)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: |
          MISSING=""
          # Treat whitespace-only secrets as missing.
          is_blank() { [ -z "$(printf '%s' "$1" | tr -d '[:space:]')" ]; }

          if is_blank "$VITE_SUPABASE_URL"; then
            MISSING="$MISSING VITE_SUPABASE_URL"
          fi
          if is_blank "$VITE_SUPABASE_PUBLISHABLE_KEY" && is_blank "$VITE_SUPABASE_ANON_KEY"; then
            MISSING="$MISSING VITE_SUPABASE_PUBLISHABLE_KEY(or VITE_SUPABASE_ANON_KEY)"
          fi
          if is_blank "$VITE_SUPABASE_PROJECT_ID"; then
            echo "::warning::VITE_SUPABASE_PROJECT_ID is not set (optional, used by tooling)."
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::CI preflight failed. Missing or empty repository secrets:" >&2
            for name in $MISSING; do
              echo "   - $name" >&2
            done
            echo "   Add them at Settings -> Secrets and variables -> Actions -> New repository secret." >&2
            echo "   Note: a secret that exists but is empty still counts as missing." >&2
            exit 1
          fi
          echo "CI preflight passed: Supabase environment variables are configured."

      - name: Install dependencies (lockfile must be in sync)
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Start dev server
        run: |
          # nohup + detached stdio so the server survives this step's shell,
          # and its output lands in a file we can print if startup fails.
          nohup bun run dev > /tmp/dev-server.log 2>&1 &
          echo $! > /tmp/dev-server.pid
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Wait for dev server
        run: |
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            # Fail fast when the server already died instead of waiting 2 min.
            if [ -f /tmp/dev-server.pid ] && ! kill -0 "$(cat /tmp/dev-server.pid)" 2>/dev/null; then
              echo "dev server process exited during startup" >&2
              break
            fi
            sleep 2
          done
          echo "dev server never became ready" >&2
          echo "----- dev server log -----" >&2
          cat /tmp/dev-server.log >&2 || true
          echo "----- curl diagnostics -----" >&2
          curl -v http://localhost:8080/ >&2 || true
          exit 1


      - name: Run Playwright tests
        run: bunx playwright test
        env:
          # CI runners use the Playwright-managed Chromium, not /bin/chromium.
          PLAYWRIGHT_CHROMIUM_PATH: ''
          PLAYWRIGHT_BASE_URL: http://localhost:8080

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
