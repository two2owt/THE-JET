name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Install, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Pin npm to the version in package.json packageManager
        run: |
          corepack enable
          corepack prepare "$(node -p "require('./package.json').packageManager")" --activate
          node -v && npm -v

      - name: Verify lockfile is in sync
        run: node scripts/verify-lockfile.mjs

      - name: Migration preflight (advisory lock signatures)
        run: node scripts/preflight-advisory-locks.mjs

      - name: Install dependencies (lockfile must be in sync)
        run: npm ci

      - name: Production build
        run: npx vite build

      - name: Unit tests
        run: npm test