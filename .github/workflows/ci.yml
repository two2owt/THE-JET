name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Install, build, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Verify lockfile is in sync
        run: node scripts/verify-lockfile.mjs

      - name: Install dependencies (lockfile must be in sync)
        run: npm ci

      - name: Production build
        run: npx vite build

      - name: Unit tests
        run: npm test